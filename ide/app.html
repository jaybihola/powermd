<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>powermd ide</title>
<script src="../src/powermd.js"></script>
<link rel="stylesheet" href="app.css"/>
</head>
<body>
<div id="app">

  <header class="topbar">
    <button class="iconbtn on" id="sideToggle" title="Toggle sidebar (⌘B)" aria-label="Toggle sidebar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>
    </button>
    <div class="crumb" id="crumb"></div>
    <div class="actions">
      <div class="seg" id="viewmodes">
        <button data-mode="editor" title="Editor (⌘1)" aria-label="Editor">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h10M4 12h16M4 18h7"/></svg>
        </button>
        <button data-mode="split" class="active" title="Split (⌘2)" aria-label="Split">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M12 4v16"/></svg>
        </button>
        <button data-mode="preview" title="Preview (⌘3)" aria-label="Preview">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="2.5"/></svg>
        </button>
      </div>
      <button class="iconbtn" id="wrapBtn" title="Soft wrap (⌥Z)" aria-label="Soft wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h13a3 3 0 1 1 0 6h-3"/><path d="m16 15-2 3 2 3" transform="translate(0 -3)"/></svg>
      </button>
      <button class="iconbtn" id="inspBtn" title="Front matter" aria-label="Front matter">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="4" y1="8" x2="20" y2="8"/><line x1="4" y1="16" x2="20" y2="16"/><circle cx="9" cy="8" r="2.3" fill="var(--bg-elev)"/><circle cx="15" cy="16" r="2.3" fill="var(--bg-elev)"/></svg>
      </button>
    </div>
  </header>

  <div class="body" id="body">
    <aside class="sidebar" id="sidebar">
      <div class="side-head">
        <span>Explorer</span>
        <span class="side-actions">
          <button id="attach" title="Attach folder">📂</button>
          <button id="newfile" title="New file">＋</button>
          <button id="refresh" title="Refresh">⟳</button>
        </span>
      </div>
      <div class="tree" id="tree"></div>
      <div class="side-root" id="sideRoot"></div>
    </aside>

    <div class="divider vert" data-div="sidebar"></div>

    <main class="panes" id="panes" data-mode="split">
      <section class="pane editor-pane">
        <div class="tabbar" id="tabbar"></div>
        <div class="fmbar" id="fmbar"></div>
        <div class="editor-wrap" id="editorWrap">
          <div class="gutter-bg"></div>
          <div class="highlight" aria-hidden="true"><div class="hl-inner" id="hl"></div></div>
          <textarea id="src" spellcheck="false" wrap="off" placeholder="Select a file from the Explorer (or ⌘P), or press ＋ to create one."></textarea>
        </div>
      </section>
      <div class="divider vert" data-div="editor"></div>
      <section class="pane preview-pane">
        <iframe id="preview" title="preview"></iframe>
        <div class="empty" id="empty">
          <div class="empty-art">⚡</div>
          <h2>powermd ide</h2>
          <p>Open a Markdown file to start editing.<br/>Live preview appears here.</p>
        </div>
      </section>
    </main>
  </div>

  <!-- document settings sheet -->
  <div class="fm-overlay" id="inspector">
    <div class="fm-sheet">
      <div class="insp-head"><span>Document settings</span><button id="inspClose" class="btn primary">Done</button></div>
      <div class="insp-body" id="inspBody"></div>
    </div>
  </div>

  <!-- command palette / fuzzy file finder -->
  <div class="overlay" id="overlay">
    <div class="palette">
      <input id="palInput" type="text" autocomplete="off" spellcheck="false" placeholder="Type a command…"/>
      <ul class="pal-list" id="palList"></ul>
    </div>
  </div>

  <!-- right-click context menu -->
  <div class="ctxmenu" id="ctxmenu"></div>

  <footer class="statusbar">
    <span id="status" class="status"></span>
    <span class="spacer"></span>
    <span id="counts" class="counts"></span>
    <label class="check"><input type="checkbox" id="autosave" checked/> Autosave</label>
  </footer>

</div>
<script src="app.js"></script>
</body>
</html>
